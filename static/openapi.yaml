openapi: 3.1.0
info:
  title: IoT and IM Microservices API (Synchronous)
  description: |
    Formal API specification for the Synchronous Microservices Architecture involving:
    - **IM Services**: Telegram (/IMTelegram) and Line (/IMLine)
    - **IoT Broker**: Central logic and message routing (/IoTBroker)
    - **IoT Device Controller**: Proxy for physical devices (/IoTDevice)
    
    This API facilitates synchronous HTTP communication between chat platforms and IoT devices.
  version: 2.1.0
  contact:
    name: Rocer52
    email: batte9306@gmail.com

servers:
  - url: http://localhost:5000
    description: IM Telegram Service
  - url: http://localhost:5001
    description: IM Line Service
  - url: http://localhost:5002
    description: IoT Broker Service
  - url: http://localhost:5003
    description: IoT Device Controller Service
  - url: http://localhost:5010
    description: ESP32 Virtual Device
  - url: http://localhost:5011
    description: Raspberry Pi Virtual Device

tags:
  - name: Telegram
    description: Operations for Telegram IM Service.
  - name: Line
    description: Operations for Line IM Service.
  - name: IoTBroker
    description: Core logic for parsing messages and binding devices.
  - name: IoTDevice
    description: Controller methods to interact with physical/virtual devices.

paths:
  # ==============================
  # Telegram Microservice Paths
  # ==============================
  /IMTelegram/webhook:
    post:
      tags:
        - Telegram
      summary: Handle Telegram Webhook
      description: Receive and process incoming webhook events from Telegram.
      operationId: handleTelegramWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWebhookRequest'
      responses:
        '200':
          description: Processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /IMTelegram/send_message:
    post:
      tags:
        - Telegram
      summary: Send Telegram Message
      description: Send a text message to a specific Telegram chat.
      operationId: sendTelegramMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: string
                  example: "123456789"
                text:
                  type: string
                  example: "Hello form System"
              required:
                - chat_id
                - text
      responses:
        '200':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'

  # ==============================
  # Line Microservice Paths
  # ==============================
  /IMLine/webhook:
    post:
      tags:
        - Line
      summary: Handle Line Webhook
      description: Receive and process incoming webhook events from Line.
      operationId: handleLineWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineWebhookRequest'
      responses:
        '200':
          description: Processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'

  /IMLine/send_message:
    post:
      tags:
        - Line
      summary: Send Line Message
      description: Send a text message to a specific Line user.
      operationId: sendLineMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chat_id:
                  type: string
                  description: Line User ID
                  example: "U1234567890abcdef1234567890abcdef"
                text:
                  type: string
                  example: "Hello from System"
              required:
                - chat_id
                - text
      responses:
        '200':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'

  # ==============================
  # IoT Broker Paths
  # ==============================
  /IoTBroker/parse_message:
    post:
      tags:
        - IoTBroker
      summary: Parse and Route Message
      description: Analyze incoming text commands and route them to the appropriate device controller.
      operationId: parseIoTMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_text:
                  type: string
                  example: "turn on esp32_light_001"
                chat_id:
                  type: string
                  example: "123456789"
                platform:
                  type: string
                  enum: [telegram, line]
                  example: "telegram"
                user_id:
                  type: string
                  example: "123456789"
                username:
                  type: string
                  example: "user123"
              required:
                - message_text
                - chat_id
                - platform
      responses:
        '200':
          description: Action executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /IoTBroker/bind:
    post:
      tags:
        - IoTBroker
      summary: Bind Device
      description: Bind a user chat ID to a specific device ID.
      operationId: bindDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  example: "esp32_light_001"
                chat_id:
                  type: string
                  example: "123456789"
                platform:
                  type: string
                  enum: [telegram, line]
                  example: "telegram"
              required:
                - device_id
                - chat_id
                - platform
      responses:
        '200':
          description: Binding successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'
        '400':
          description: Invalid parameters or device ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==============================
  # IoT Device Controller Paths
  # ==============================
  /IoTDevice/Enable:
    get:
      tags:
        - IoTDevice
      summary: Enable Device
      description: Send an enable command to the target physical/virtual device.
      operationId: enableDevice
      parameters:
        - $ref: '#/components/parameters/device_id'
        - $ref: '#/components/parameters/chat_id'
        - $ref: '#/components/parameters/platform'
        - $ref: '#/components/parameters/user_id'
        - $ref: '#/components/parameters/username'
        - $ref: '#/components/parameters/bot_token'
      responses:
        '200':
          description: Device enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '500':
          description: Device unreachable or error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /IoTDevice/Disable:
    get:
      tags:
        - IoTDevice
      summary: Disable Device
      description: Send a disable command to the target physical/virtual device.
      operationId: disableDevice
      parameters:
        - $ref: '#/components/parameters/device_id'
        - $ref: '#/components/parameters/chat_id'
        - $ref: '#/components/parameters/platform'
        - $ref: '#/components/parameters/user_id'
        - $ref: '#/components/parameters/username'
        - $ref: '#/components/parameters/bot_token'
      responses:
        '200':
          description: Device disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '500':
          description: Device unreachable or error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /IoTDevice/GetStatus:
    get:
      tags:
        - IoTDevice
      summary: Get Device Status
      description: Query the current status of the target physical/virtual device.
      operationId: getDeviceStatus
      parameters:
        - $ref: '#/components/parameters/device_id'
        - $ref: '#/components/parameters/chat_id'
        - $ref: '#/components/parameters/platform'
        - $ref: '#/components/parameters/user_id'
        - $ref: '#/components/parameters/username'
        - $ref: '#/components/parameters/bot_token'
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '500':
          description: Device unreachable or error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    BasicResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation successful"
        success:
          type: boolean
          example: true
          description: "Alternative key for ok used in some endpoints"

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Invalid request or internal error"
      required:
        - message

    BrokerResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        action:
          type: string
          example: "Enable"
        device_id:
          type: string
          example: "esp32_light_001"
        message:
          type: string
          example: "Command executed"

    DeviceResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Device enabled"
        state:
          type: string
          example: "on"
        device_id:
          type: string
          example: "esp32_light_001"
      required:
        - status
        - message
        - state
        - device_id

    TelegramWebhookRequest:
      type: object
      properties:
        message:
          type: object
          properties:
            text:
              type: string
              example: "turn on esp32_light_001"
            chat:
              type: object
              properties:
                id:
                  type: string
                  example: "123456789"
                type:
                  type: string
                  example: "private"
            from:
              type: object
              properties:
                id:
                  type: string
                  example: "123456789"
                username:
                  type: string
                  example: "user123"
      required:
        - message

    LineWebhookRequest:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: "message"
              message:
                type: object
                properties:
                  type:
                    type: string
                    example: "text"
                  text:
                    type: string
                    example: "turn on raspberrypi_light_001"
              source:
                type: object
                properties:
                  type:
                    type: string
                    example: "user"
                  userId:
                    type: string
                    example: "U1234567890abcdef1234567890abcdef"
      required:
        - events

  parameters:
    device_id:
      name: device_id
      in: query
      description: Target Device ID
      required: true
      schema:
        type: string
        enum:
          - esp32_light_001
          - esp32_fan_002
          - raspberrypi_light_001
          - raspberrypi_fan_002
        example: "esp32_light_001"

    chat_id:
      name: chat_id
      in: query
      description: Chat ID of the requester
      required: false
      schema:
        type: string
        example: "123456789"

    platform:
      name: platform
      in: query
      description: Originating platform
      required: false
      schema:
        type: string
        enum: [telegram, line]
        default: telegram
        example: "telegram"

    user_id:
      name: user_id
      in: query
      description: User ID
      required: false
      schema:
        type: string
        example: "123456789"

    username:
      name: username
      in: query
      description: User display name
      required: false
      schema:
        type: string
        example: "user123"

    bot_token:
      name: bot_token
      in: query
      description: Bot token (internal use)
      required: false
      schema:
        type: string
        example: "123456789:ABCDEF_ExampleBotToken"